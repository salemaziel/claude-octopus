3. Update helpers (e.g., scripts/helpers/build-fleet.sh, scripts/helpers/check-providers.sh, scripts/helpers/octo-model-config.sh)
4. Update scripts/install-deps.sh if needed
5. Add/modify provider detection logic (e.g., auth file grep, binary checks)
6. Add or update tests/unit/test-<provider>-provider.sh
7. Address follow-up review findings by tightening detection logic or fixing edge cases

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: scripts/lib/<provider>.sh, scripts/lib/dispatch.sh, scripts/lib/providers.sh

